name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://ros.cachix.org
            extra-trusted-public-keys = ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo=

      - name: Enable KVM for offline integration tests
        run: sudo chmod a+rw /dev/kvm

      # Runs formatting, static checks, the proxy VM lifecycle and evaluates
      # nixosConfigurations.koru, which embeds home-manager for that host.
      # It does NOT evaluate homeConfigurations.
      - run: nix flake check --no-update-lock-file --print-build-logs

      - name: Check independent development tools
        run: nix flake check --no-update-lock-file --print-build-logs path:./profile

      # Force evaluation of the standalone user profile (whose pkgs instance is
      # built separately) and of every home module, including ones no host
      # currently imports, so a rotted config fails CI instead of surprising us
      # the day it is re-enabled.
      - run: |
          nix eval --no-update-lock-file --raw .#homeConfigurations.koru.activationPackage.drvPath
          nix eval --no-update-lock-file --raw .#homeConfigurations.all.activationPackage.drvPath

      # CLI contracts use local mocks; module edits evaluate temporary configs.
      # These scripts use fixtures; the VM check above exercises real services
      # and probes only a loopback HTTP fixture, without activating host profiles.
      - run: |
          nix develop --no-update-lock-file --command bash -euo pipefail -c '
            shellcheck scripts/maintenance.sh scripts/home-modules.sh scripts/proxyctl.sh \
              scripts/koru.sh scripts/koru/*.sh \
              tests/home-modules/run.sh tests/proxyctl/run.sh tests/koru/run.sh tests/profile/run.sh
            tests/proxyctl/run.sh
            tests/home-modules/run.sh
            tests/koru/run.sh
            tests/profile/run.sh
            python3 tests/codex-colors/run.py
          '

  build:
    needs: flake-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://ros.cachix.org
            extra-trusted-public-keys = ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo=
      # Real closures, including embedded and standalone Home Manager. These
      # builds do not activate this laptop configuration on the CI runner.
      - name: Build system and user configuration
        run: |
          nix build --no-link --no-update-lock-file --print-build-logs \
            .#nixosConfigurations.koru.config.system.build.toplevel \
            .#homeConfigurations.koru.activationPackage
